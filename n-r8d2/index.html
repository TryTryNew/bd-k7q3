<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>孟加拉筆記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="孟加拉筆記">
<meta name="theme-color" content="#1f4e4a">
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e1d8;--acc2:#e9eef0;--ok:#0f6b4f;--warn:#a15c00;--warnbg:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#ecebe8;--mute:#9aa0a6;--line:#30343a;--acc2:#232a2e;--ok:#5cc39b;--warn:#f0b35a;--warnbg:#2e2618}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--mute);font-size:14px;margin:0 0 18px}
a.big{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;min-height:96px}
a.big .ic{font-size:34px;width:56px;height:56px;border-radius:14px;background:var(--acc2);display:flex;align-items:center;justify-content:center;flex:none}
a.big b{display:block;font-size:20px}a.big span.d{color:var(--mute);font-size:14px}
#st{border-radius:12px;padding:10px 12px;font-size:14px;margin:16px 0;background:var(--warnbg);color:var(--warn)}#st.ok{background:var(--acc2);color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--warn)}
.foot{color:var(--mute);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>孟加拉筆記</h1>
  <p class="sub">只給我們自己看・沒有網路也能用</p>
  <a class="big" href="notes/"><span class="ic">📖</span><span><b>伊斯蘭教與基督教對照</b><span class="d">逐章比較・名稱發音（預錄／當地錄音）</span></span></a>
  <a class="big" href="mill/"><span class="ic">🏭</span><span><b>紡紗針織廠現場手冊</b><span class="d">棉花→紗→布、現場要看什麼、問什麼</span></span></a>
  <div id="st">正在檢查離線資料…</div>
  <p class="foot">版本 r2（對照筆記 v3・工廠手冊 v1）</p>
</main>
<script>
const st=document.getElementById('st');
function show(h,t){if(t&&h>=t){st.className='ok';st.textContent='✓ 已可離線使用（全部 '+t+' 個檔案都存在這支手機）';return true}
 st.className='';st.innerHTML='正在下載離線資料… '+h+' / '+(t||'?')+'<div class="bar"><i style="width:'+(t?Math.round(h/t*100):0)+'%"></i></div>請保持網路連線，下載完才能離線使用。';return false}
if(!('serviceWorker' in navigator)){st.textContent='這個瀏覽器不支援離線使用。iPhone 請用 Safari，Android 請用 Chrome。'}
else{let reg=null,t=0;
 navigator.serviceWorker.register('sw.js').then(r=>{reg=r}).catch(()=>{st.textContent='離線功能啟動失敗，請重新整理再試一次。'});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='status'&&reg&&e.source&&[reg.installing,reg.waiting,reg.active].includes(e.source)&&show(e.data.have,e.data.total))clearInterval(t)});
 const ask=()=>{if(!reg)return;const w=reg.installing||reg.waiting||reg.active;if(w)w.postMessage('status')};
 t=setInterval(ask,1000);}
</script>
</body>
</html>
