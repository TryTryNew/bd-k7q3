<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>孟加拉語生活用語</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="孟加拉">
<meta name="theme-color" content="#1f4e4a">
<link rel="stylesheet" href="../fonts/fonts.css">

<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e1d8;--acc:#0f6b4f;--acc2:#e6f2ed;--warn:#a15c00;--warnbg:#fff4e0;--star:#d99a00}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181b;--card:#1f2226;--ink:#ecebe8;--mute:#9aa0a6;--line:#30343a;--acc:#5cc39b;--acc2:#1d3029;--warn:#f0b35a;--warnbg:#2e2618}}
:root[data-theme=dark]{--bg:#16181b;--card:#1f2226;--ink:#ecebe8;--mute:#9aa0a6;--line:#30343a;--acc:#5cc39b;--acc2:#1d3029;--warn:#f0b35a;--warnbg:#2e2618}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans Bengali","Segoe UI",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* 頂部：標題和搜尋會捲走，只有分類列固定 */
.top{padding:calc(10px + env(safe-area-inset-top)) 12px 6px;max-width:760px;margin:0 auto}
.titlerow{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;flex:1}
h1 small{font-size:13px;color:var(--mute);font-weight:normal}
.iconbtn{min-width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;gap:4px}
.iconbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.iconbtn .t{font-size:13px}
input[type=search]{width:100%;margin-top:8px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;max-width:760px;margin:0 auto}
.tabs-in::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;height:38px;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

main{padding:6px 12px 90px;max-width:760px;margin:0 auto}
.secnote{background:var(--acc2);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 10px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--acc2);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.hint p{margin:0;flex:1}
.hint button{border:none;background:var(--acc);color:#fff;border-radius:8px;height:36px;padding:0 12px;flex:none}

/* 卡片：文字用整個寬度，按鈕在底部 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;margin:10px 0}
.bn{font-family:"Noto Sans Bengali","Kohinoor Bangla","Bangla Sangam MN",sans-serif;font-size:calc(22px*var(--fs,1));line-height:1.45}
.bn .w{border-radius:4px;padding:0 1px;cursor:pointer}
.bn .w.now,.bn.now{background:var(--acc2)}
.zy{font-size:calc(16px*var(--fs,1));color:var(--acc);letter-spacing:.5px;margin-top:2px}
.ro{font-size:calc(13px*var(--fs,1));color:var(--mute);font-style:italic}
.zh{font-size:calc(16px*var(--fs,1));margin-top:4px}
.en{font-size:calc(14px*var(--fs,1));color:var(--mute)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-right:4px;vertical-align:2px}
.tag.d{background:var(--acc2);color:var(--acc)}
.tag.f{background:var(--warnbg);color:var(--warn)}
.note{font-size:13px;background:var(--warnbg);border-radius:8px;padding:6px 8px;margin-top:8px}
.note.i{background:var(--acc2)}
.acts{display:flex;gap:6px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.act{height:44px;border:none;background:var(--acc2);color:var(--acc);border-radius:10px;padding:0 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.act.main{background:var(--acc);color:#fff}
.act.ghost{background:transparent;color:var(--mute)}
.act.star{background:transparent;color:var(--mute);font-size:22px;margin-left:auto;width:44px;justify-content:center;padding:0}
.act.star.on{color:var(--star)}
.act.ghost.on{color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;min-height:44px}
.num .n{font-size:13px;color:var(--mute)}
.num .b{font-family:"Noto Sans Bengali",sans-serif;font-size:calc(20px*var(--fs,1))}
.num .z{font-size:calc(14px*var(--fs,1));color:var(--acc)}
.num .r{font-size:12px;color:var(--mute);font-style:italic}
.num.now{outline:2px solid var(--acc)}
h2{font-size:15px;margin:16px 0 4px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.hide-bn .card .bn,.hide-zy .card .zy,.hide-ro .card .ro,.hide-zh .card .zh,.hide-en .card .en{display:none}
.hide-bn .num .b,.hide-zy .num .z,.hide-ro .num .r{display:none}

/* 設定 */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;display:none;max-height:85vh;overflow:auto}
.open{display:block}
.sheet h3{margin:0 0 12px;font-size:17px;padding-right:50px}
.sheet .x{position:absolute;right:10px;top:8px;width:44px;height:44px;border:none;background:none;font-size:24px;color:var(--mute)}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .k{width:4.5em;color:var(--mute);font-size:14px}
.srow:last-of-type{border-bottom:none}
.fsval{min-width:3.5em;text-align:center;font-size:14px}
.sfoot{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.6}

/* 給對方看：全螢幕大字 */
#show{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#show.open{display:flex}
#show .bar{display:flex;justify-content:flex-end}
#show .big{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;overflow:auto}
#show .sbn{font-family:"Noto Sans Bengali","Kohinoor Bangla","Bangla Sangam MN",sans-serif;font-size:clamp(34px,10vw,72px);line-height:1.35;font-weight:600}
#show .szh{font-size:18px;color:var(--mute)}
#show .splay{height:64px;min-width:64px;padding:0 28px;border:none;border-radius:32px;background:var(--acc);color:#fff;font-size:20px}
#show .snav{display:flex;justify-content:space-between;gap:8px}
#show .snav button{flex:1;height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:15px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;max-width:90vw;display:none;z-index:40}
</style>
</head>
<body>
<div class="top">
  <div class="titlerow">
    <h1>孟加拉語生活用語 <small>বাংলা</small></h1>
    <a class="iconbtn" href="../" aria-label="回首頁" style="text-decoration:none">⌂</a>
    <button class="iconbtn" id="slow" aria-pressed="false" title="慢速唸">🐢<span class="t">慢速</span></button>
    <button class="iconbtn" id="gear" aria-label="設定">⚙</button>
  </div>
  <input type="search" id="q" placeholder="搜尋中文、英文、孟加拉文…">
</div>
<nav class="tabs" aria-label="分類"><div class="tabs-in" id="tabs"></div></nav>
<main id="main"></main>

<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <button class="x" id="sheetX" aria-label="關閉">×</button>
  <h3 id="sheetTitle">設定</h3>
  <div class="srow"><span class="k">顯示</span><span id="showOpts" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
  <div class="srow"><span class="k">說明</span><button class="chip" id="notesAll">預設展開說明</button></div>
  <div class="srow"><span class="k">字體</span><button class="iconbtn" id="fsDown" aria-label="字變小">A−</button><span class="fsval" id="fsVal"></span><button class="iconbtn" id="fsUp" aria-label="字變大">A+</button></div>
  <div class="sfoot">注音只是近似音，請以聲音為準。注音規則跟三語讀經一樣：不送氣的 ক ট ত প চ 標 ㄍ ㄉ ㄉ ㄅ ㄐ，送氣的 খ ঠ থ ফ ছ 標 ㄎ ㄊ ㄊ ㄈ ㄑ；r 是舌尖輕彈一下，標 ㄌ；字尾的 ㄇ、ㄋ、ㄎ、ㄉ 等只輕輕帶過。<br>點孟加拉文的單字只唸那個字；「給對方看」會把句子放大成全螢幕。<br>聲音是預錄的（微軟孟加拉語男聲），沒有網路也能播。<br>版本：生活用語 v1（離線版，r2）</div>
</section>

<div id="show" role="dialog" aria-label="給對方看">
  <div class="bar"><button class="iconbtn" id="showX" aria-label="關閉">✕</button></div>
  <div class="big">
    <div class="sbn" id="sBn"></div>
    <button class="splay" id="sPlay">▶ 唸給他聽</button>
    <div class="szh" id="sZh"></div>
  </div>
  <div class="snav"><button id="sPrev">‹ 上一句</button><button id="sNext">下一句 ›</button></div>
</div>
<div id="toast"></div>
<script>

let clipTimer=null,clipDone=null,speakToken=0;
function stopAll(){speakToken++;clearInterval(clipTimer);try{PL.pause()}catch(e){}try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}const d=clipDone;clipDone=null;if(d)d()}
async function playClip(key,from,to,onEnd){
  const c=AUD&&AUD.c[key];if(!c)return false;
  stopAll();const tok=speakToken;
  let url;try{url=await fileUrl(AUD.f[c[0]])}catch(e){return false}
  if(tok!==speakToken)return true;
  const s=from!=null?from:c[1],e=to!=null?to:c[2];
  clipDone=onEnd||null;
  const finish=()=>{if(tok!==speakToken)return;clearInterval(clipTimer);PL.pause();const d=clipDone;clipDone=null;if(d)d()};
  if(PL.src!==url)PL.src=url;
  PL.playbackRate=slow?0.75:1;
  const go=()=>{try{PL.currentTime=s}catch(er){}PL.playbackRate=slow?0.75:1;PL.play().catch(()=>finish());
    clearInterval(clipTimer);clipTimer=setInterval(()=>{if(PL.currentTime>=e||PL.ended)finish()},25)};
  if(PL.readyState>=1)go();else PL.addEventListener("loadedmetadata",go,{once:true});

function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}

function pickVoice(lang){const L=voices.filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang));
  const pref=lang==="bn"?["bn-bd","bn-in","bn"]:["en-us","en-gb","en"];
  for(const p of pref){const c=L.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(p));if(c.length){return c.find(v=>/natural|enhanced|premium|neural|google/i.test(v.name))||c[0]}}return null}

async function say(text,lang,onEnd){
  stopAll();const tok=speakToken;const done=()=>{if(tok===speakToken&&onEnd)onEnd()};
  if(!("speechSynthesis" in window)){toast("這個瀏覽器不能發音");done();return}

  if(!v&&lang==="bn"){toast("這句沒有預錄，這台手機也沒有孟加拉語語音。",4000);done();return}
  const u=new SpeechSynthesisUtterance(text);u.lang=v?v.lang:(lang==="bn"?"bn-BD":"en-US");if(v)u.voice=v;u.rate=slow?0.6:0.95;

const normW=w=>w.replace(/[।?!,.;:—…“”"'()\/]/g,"").trim();
/* 唸整句（或點到的那個字）：先用預錄，沒有才用手機語音 */
async function speakItem(el,key,text,wordEl){
  const mark=wordEl||el;mark.classList.add("now");const off=()=>mark.classList.remove("now");
  const c=AUD&&AUD.c[key];
  if(c&&wordEl){const ws=c[3]||[];const target=normW(wordEl.textContent);
    const all=[...el.querySelectorAll(".w")];const idx=all.indexOf(wordEl);
    let hit=ws.find(w=>normW(w[0])===target);
    if(!hit&&ws.length===all.length)hit=ws[idx];
    if(hit&&await playClip(key,Math.max(c[1],hit[1]-0.04),Math.min(c[2],hit[1]+hit[2]+0.1),off))return}
  else if(c&&await playClip(key,null,null,off))return;
  say((wordEl?wordEl.textContent:text).replace(/[।?!,—…\/]/g," "),"bn",off)}

$("#gear").onclick=openSheet;$("#sheetX").onclick=closeSheet;$("#sheetBg").onclick=closeSheet;
function showOpts(){const o=$("#showOpts");o.innerHTML="";
  [["bn","孟加拉文"],["zy","注音"],["ro","拼音"],["zh","中文"],["en","英文"]].forEach(([k,n])=>{const b=document.createElement("button");b.className="chip"+(SHOW[k]?" on":"");b.textContent=(SHOW[k]?"✓ ":"")+n;b.setAttribute("aria-pressed",!!SHOW[k]);b.onclick=()=>{SHOW[k]=SHOW[k]?0:1;LS.set("show",SHOW);showOpts();applyShow()};o.appendChild(b)})}
function applyShow(){["bn","zy","ro","zh","en"].forEach(k=>document.body.classList.toggle("hide-"+k,!SHOW[k]))}
function applyFs(){document.body.style.setProperty("--fs",FS[fsi]);$("#fsVal").textContent=(fsi+1)+" / "+FS.length;$("#fsDown").disabled=fsi===0;$("#fsUp").disabled=fsi===FS.length-1}
$("#fsDown").onclick=()=>{if(fsi>0){fsi--;LS.set("fsi",fsi);applyFs()}};
$("#fsUp").onclick=()=>{if(fsi<FS.length-1){fsi++;LS.set("fsi",fsi);applyFs()}};
function applyNotesAll(){const b=$("#notesAll");b.classList.toggle("on",notesAll);b.textContent=(notesAll?"✓ ":"")+"預設展開說明"}
$("#notesAll").onclick=()=>{notesAll=!notesAll;LS.set("notesAll",notesAll);applyNotesAll();render()};
const sb=$("#slow");const setSlow=()=>{sb.classList.toggle("on",slow);sb.setAttribute("aria-pressed",slow)};sb.onclick=()=>{slow=!slow;LS.set("slow",slow);setSlow();toast(slow?"已切換成慢速":"已切換成正常速度",1500)};

/* ---------- 畫面 ---------- */
function tabs(){const t=$("#tabs");t.innerHTML="";
  [{id:"star",name:"★ 收藏"},...CATS.map(c=>({id:c.id,name:c.name}))].forEach(c=>{const b=document.createElement("button");b.className="chip"+(c.id===cur?" on":"");b.textContent=c.name;
    b.onclick=()=>{cur=c.id;LS.set("cat",cur);$("#q").value="";tabs();render();window.scrollTo(0,0)};t.appendChild(b);if(c.id===cur)setTimeout(()=>b.scrollIntoView({inline:"center",block:"nearest"}),0)})}
function card(it,list,idx){const d=document.createElement("div");d.className="card";
  const tags=(it.fl.includes("d")?'<span class="tag d">你的題庫</span>':"")+(it.fl.includes("f")?'<span class="tag f">已修正</span>':"");
  d.innerHTML=(tags?"<div>"+tags+"</div>":"")+'<div class="bn"></div><div class="zy">'+zyH(it.zy)+'</div><div class="ro">'+esc(it.ro)+'</div><div class="zh">'+esc(it.zh)+'</div><div class="en">'+esc(it.en)+"</div>"+
   (it.note?'<div class="note'+(it.fl.includes("f")?"":" i")+'"'+(notesAll?"":" hidden")+">"+esc(it.note)+"</div>":"")+
   '<div class="acts"><button class="act main play">▶ 唸</button><button class="act showb">⤢ 給對方看</button>'+
   (it.note?'<button class="act ghost nb'+(notesAll?" on":"")+'" aria-expanded="'+notesAll+'">ⓘ 說明</button>':"")+
   '<button class="act star'+(stars.has(it.id)?" on":"")+'" aria-label="收藏">'+(stars.has(it.id)?"★":"☆")+"</button></div>";
  const bnEl=d.querySelector(".bn");bnEl.innerHTML=bnWords(it.bn,it.fl.includes("w"));bindWordTaps(bnEl,it);
  d.querySelector(".play").onclick=()=>speakItem(bnEl,it.key,it.bn,null);
  d.querySelector(".showb").onclick=()=>openShow(list,idx);
  const nb=d.querySelector(".nb");if(nb)nb.onclick=()=>{const n=d.querySelector(".note");const h=!n.hidden;n.hidden=h;nb.classList.toggle("on",!h);nb.setAttribute("aria-expanded",!h)};
  d.querySelector(".star").onclick=e=>{stars.has(it.id)?stars.delete(it.id):stars.add(it.id);LS.set("stars",[...stars]);const s=e.currentTarget;s.classList.toggle("on");s.textContent=stars.has(it.id)?"★":"☆";if(cur==="star")render()};
  return d}
function cards(m,list){list.forEach((it,i)=>m.appendChild(card(it,list,i)))}
function numGrid(list){const g=document.createElement("div");g.className="grid";
  list.forEach(n=>{const b=document.createElement("button");b.className="num";
    b.innerHTML='<div class="n">'+n[0]+"　"+toBn(n[0])+'</div><div class="b">'+esc(n[1])+'</div><div class="z">'+esc(n[3])+'</div><div class="r">'+esc(n[2])+"</div>";
    b.onclick=()=>speakItem(b,"n-"+n[0],n[1],null);g.appendChild(b)});return g}
function hint(m){if(LS.get("hint1",false))return;const h=document.createElement("div");h.className="hint";
  h.innerHTML="<p>小提示：按 <b>▶ 唸</b> 唸整句，點孟加拉文的某個字只唸那個字。要問路、點餐時，按 <b>⤢ 給對方看</b>，句子會放大成全螢幕。</p><button>知道了</button>";
  h.querySelector("button").onclick=()=>{LS.set("hint1",true);h.remove()};m.appendChild(h)}
function render(){const m=$("#main");m.innerHTML="";hint(m);const q=$("#q").value.trim().toLowerCase();
  if(q){const r=ALL.filter(it=>[it.bn,it.ro,it.zy,it.zh,it.en].join(" ").toLowerCase().includes(q));
    const nr=NUMS.filter(n=>String(n[0])===q||n[1].includes(q)||n[2].includes(q));
    if(!r.length&&!nr.length){m.insertAdjacentHTML("beforeend",'<div class="empty">找不到「'+esc(q)+'」</div>');return}
    let last="";r.forEach((it,i)=>{if(it.cn!==last){const h=document.createElement("h2");h.textContent=it.cn;m.appendChild(h);last=it.cn}m.appendChild(card(it,r,i))});
    if(nr.length){const h=document.createElement("h2");h.textContent="數字";m.appendChild(h);m.appendChild(numGrid(nr))}return}
  if(cur==="star"){const r=ALL.filter(it=>stars.has(it.id));if(!r.length){m.insertAdjacentHTML("beforeend",'<div class="empty">按句子右下角的 ☆ 收藏常用的句子，會出現在這裡。</div>');return}cards(m,r);return}
  const c=CATS.find(x=>x.id===cur)||CATS[0];
  if(c.note){const n=document.createElement("div");n.className="secnote";n.textContent=c.note;m.appendChild(n)}
  if(c.nums){const n=document.createElement("div");n.className="secnote";n.textContent="點一下就唸。孟加拉語的 1–100 每個數字都有自己的說法，不像中文是組合的，所以全部列出。注意 7 সাত 和 60 ষাট 聽起來很像，買東西時可以用手指比或寫下來確認。";m.appendChild(n);m.appendChild(numGrid(NUMS));return}
  cards(m,ALL.filter(a=>a.c===c.id))}
$("#q").addEventListener("input",render);
setSlow();showOpts();applyShow();applyFs();applyNotesAll();tabs();render();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('../sw.js').catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
